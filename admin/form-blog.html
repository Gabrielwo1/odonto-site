<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastrar Artigo — BIONEP Admin</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet"/>

  <style>
  :root{
    --green-950:#003527; --green-900:#001c11; --green-700:#006b5f;
    --gold:#c49a2a; --bg:#f4f7f6; --sidebar-bg:#001811; --text:#404944;
    --border: rgba(0,0,0,0.05); --border-dark: rgba(255,255,255,0.1);
    --shadow: 0 10px 30px -10px rgba(0,0,0,0.05); --r-box: 16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;display:flex;height:100vh;overflow:hidden;}
  a{text-decoration:none;color:inherit} button{border:none;cursor:pointer;}

  /* ── SIDEBAR (Simplified for prototype) ── */
  .sidebar { width: 280px; background: var(--sidebar-bg); color: rgba(255,255,255,0.7); display: flex; flex-direction: column; padding: 32px 24px; border-right: 1px solid var(--border-dark); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; padding-left: 12px; text-decoration: none;}
  .brand-logo { width: 40px; height: 40px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .brand-logo img { width: 100%; height: 100%; object-fit: contain; filter: grayscale(1); }
  .brand-text { font-size: 20px; font-weight: 800; color: white; letter-spacing: 1px; }

  .menu-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 16px; padding-left: 12px; color: rgba(255,255,255,0.4); }
  .menu-group { margin-bottom: 32px; display: flex; flex-direction: column; gap: 8px; }
  .menu-item { padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; transition: all .2s; }
  .menu-item svg { width: 18px; height: 18px; opacity: 0.7; }
  .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.06); color: white; }
  .menu-item.active svg { opacity: 1; color: var(--gold); }

  /* ── MAIN ── */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
  .topbar { height: 80px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 10; }
  .tb-title { font-size: 20px; font-weight: 800; color: var(--green-950); display: flex; align-items: center; gap: 12px;}
  .back-link { color: #a1a1aa; transition: color .2s;} .back-link:hover{color: var(--green-950);}

  .workspace { padding: 40px; max-width: 900px; width: 100%; margin: 0 auto; }
  
  .form-panel { background: white; border: 1px solid var(--border); border-radius: var(--r-box); padding: 40px; box-shadow: var(--shadow); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .form-group.full { grid-column: 1 / -1; }
  
  label { font-size: 13px; font-weight: 700; color: var(--green-950); }
  input[type="text"], input[type="date"], select, textarea {
    width: 100%; background: #fdfdfd; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
    padding: 14px 16px; font-family: inherit; font-size: 15px; color: var(--green-950);
    outline: none; transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green-700); }
  
  .file-drop {
    border: 2px dashed rgba(0,0,0,0.1); border-radius: 12px; padding: 40px; text-align: center;
    background: #fafafa; cursor: pointer; transition: all .2s; position: relative;
  }
  .file-drop:hover { border-color: var(--green-700); background: #f0f7f5; }
  .file-drop svg { color: var(--green-700); margin-bottom: 12px; }
  .file-drop p { font-size: 14px; font-weight: 600; color: var(--text); }
  .file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; margin-top: 12px; display: none; }
  
  /* Mock Editor Toolbar */
  .editor-toolbar { display: flex; align-items: center; gap: 8px; padding: 12px; background: #f9f9f9; border: 1px solid rgba(0,0,0,0.1); border-bottom: none; border-radius: 10px 10px 0 0; }
  .editor-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text); transition: background .2s; }
  .editor-btn:hover { background: #e5e7eb; }
  .editor-area { border-radius: 0 0 10px 10px; min-height: 250px; resize: vertical; }

  .actions-row { display: flex; justify-content: flex-end; gap: 16px; margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border); }
  .btn { font-size: 14px; font-weight: 700; padding: 14px 28px; border-radius: 8px; transition: all .2s; }
  .btn-outline { background: transparent; border: 1px solid rgba(0,0,0,0.1); color: var(--text); }
  .btn-outline:hover { background: #f4f4f5; }
  .btn-primary { background: var(--green-700); color: white; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0,107,95,0.4); }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="index.html" class="brand">
      <div class="brand-logo"><img src="../logo.png" alt="BIONEP"></div>
      <div class="brand-text">BIONEP<span>.</span></div>
    </a>
    <div class="menu-lbl">Principal</div>
    <div class="menu-group">
      <a href="index.html" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Visão Geral</a>
      <a href="#" class="menu-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Artigos do Blog</a>
      <a href="#" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg> Meus Cursos</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <h2 class="tb-title">
        <a href="index.html" class="back-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
        Escrever Novo Artigo
      </h2>
    </header>

    <div class="workspace">
      <div class="form-panel">
        
        <div class="form-group full">
          <label>Título Principal (H1)</label>
          <input type="text" id="titulo" placeholder="Ex: Segunda Turma de Implantodontia..." />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Categoria / Tag</label>
            <select id="categoria">
              <option>NOTÍCIAS</option>
              <option>ARTIGO CIENTÍFICO</option>
              <option>EVENTOS</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data de Publicação</label>
            <input type="date" id="data_publicacao" />
          </div>
        </div>

        <div class="form-group full">
          <label>Descrição / Resumo (Aparece nos cards)</label>
          <textarea id="descricao" rows="2" placeholder="Digite um resumo chamativo..."></textarea>
        </div>

        <div class="form-group full">
          <label>Imagem de Capa (Thumbnail)</label>
          <div class="file-drop" id="file-drop-zone">
            <input type="file" id="capa" accept="image/*" onchange="previewImagem(this)" />
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p id="file-drop-label">Arraste uma imagem ou clique para selecionar</p>
          </div>
          <img id="img-preview" class="img-preview" alt="Preview da capa" />
        </div>

        <div class="form-group full" style="margin-top: 16px;">
          <label>Corpo do Texto (Notícia Completa)</label>
          <div class="editor-toolbar">
            <button class="editor-btn" title="Negrito"><b>B</b></button>
            <button class="editor-btn" title="Itálico"><i>I</i></button>
            <button class="editor-btn" title="Sublinhado"><u>U</u></button>
            <div style="width:1px;height:16px;background:rgba(0,0,0,0.1);margin:0 8px;"></div>
            <button class="editor-btn" title="Título H2">H2</button>
            <button class="editor-btn" title="Citação">”</button>
            <button class="editor-btn" title="Lista">•</button>
            <button class="editor-btn" title="Adicionar Imagem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></button>
          </div>
          <textarea class="editor-area" placeholder="Escreva seu artigo aqui..."></textarea>
        </div>

        <div class="actions-row">
          <button class="btn btn-outline" id="btn-rascunho" onclick="salvarPost('rascunho')">Salvar Rascunho</button>
          <button class="btn btn-primary" id="btn-publicar" onclick="salvarPost('publicado')">Publicar Artigo</button>
        </div>

      </div>
    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
checkAuth();

// ── Modo edição: detecta ?id= na URL ──────────────────────
const params = new URLSearchParams(window.location.search);
const editId = params.get("id");

if (editId) {
  document.querySelector(".tb-title").innerHTML = `
    <a href="list-blog.html" class="back-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
    Editar Artigo`;
  document.getElementById("btn-publicar").textContent = "Salvar Alterações";
  carregarPost(editId);
}

async function carregarPost(id) {
  const { data, error } = await supabaseClient.from("posts").select("*").eq("id", id).single();
  if (error || !data) { alert("Artigo não encontrado."); return; }
  document.getElementById("titulo").value       = data.titulo    || "";
  document.getElementById("categoria").value    = data.categoria || "NOTÍCIAS";
  document.getElementById("descricao").value    = data.descricao || "";
  document.querySelector(".editor-area").value  = data.conteudo  || "";
  if (data.data_publicacao) document.getElementById("data_publicacao").value = data.data_publicacao;
  if (data.imagem_url) {
    const preview = document.getElementById("img-preview");
    preview.src = data.imagem_url;
    preview.style.display = "block";
    document.getElementById("file-drop-label").textContent = "Clique para trocar a imagem";
  }
}

// ── Preview local ao escolher arquivo ─────────────────────
function previewImagem(input) {
  const file = input.files[0];
  if (!file) return;
  const preview = document.getElementById("img-preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  document.getElementById("file-drop-label").textContent = file.name;
}

// ── Upload de imagem para o Supabase Storage ──────────────
async function uploadImagem(file) {
  const ext  = file.name.split(".").pop();
  const path = `capas/${Date.now()}.${ext}`;
  const { error } = await supabaseClient.storage.from("post-images").upload(path, file, { upsert: true });
  if (error) { console.warn("Upload de imagem falhou:", error.message); return null; }
  const { data } = supabaseClient.storage.from("post-images").getPublicUrl(path);
  return data.publicUrl;
}

// ── Salvar / Publicar ─────────────────────────────────────
async function salvarPost(status) {
  const titulo          = document.getElementById("titulo").value.trim();
  const categoria       = document.getElementById("categoria").value;
  const descricao       = document.getElementById("descricao").value.trim();
  const conteudo        = document.querySelector(".editor-area").value.trim();
  const data_publicacao = document.getElementById("data_publicacao").value || null;
  const fileInput       = document.getElementById("capa");

  if (!titulo) { alert("Informe o título do artigo."); return; }

  const btnPublicar = document.getElementById("btn-publicar");
  const btnRascunho = document.getElementById("btn-rascunho");
  btnPublicar.disabled = btnRascunho.disabled = true;
  btnPublicar.textContent = "Salvando...";

  // Upload de imagem (opcional)
  let imagem_url = null;
  if (editId) {
    // Mantém a URL atual se não foi trocada
    const preview = document.getElementById("img-preview");
    if (preview.style.display !== "none" && !fileInput.files[0]) imagem_url = preview.src;
  }
  if (fileInput.files[0]) {
    imagem_url = await uploadImagem(fileInput.files[0]);
  }

  const payload = { titulo, categoria, descricao, conteudo, status, data_publicacao };
  if (imagem_url) payload.imagem_url = imagem_url;

  let error;
  if (editId) {
    ({ error } = await supabaseClient.from("posts").update(payload).eq("id", editId));
  } else {
    ({ error } = await supabaseClient.from("posts").insert([payload]));
  }

  if (error) {
    alert("Erro ao salvar: " + error.message);
    console.error(error);
    btnPublicar.disabled = btnRascunho.disabled = false;
    btnPublicar.textContent = editId ? "Salvar Alterações" : "Publicar Artigo";
  } else {
    alert(status === "publicado" ? "Artigo publicado com sucesso 🚀" : "Rascunho salvo!");
    window.location.href = "list-blog.html";
  }
}
</script>
</body>
</html>
