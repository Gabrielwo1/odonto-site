<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastrar Curso — BIONEP Admin</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet"/>

  <style>
  :root{
    --green-950:#003527; --green-900:#001c11; --green-700:#006b5f;
    --gold:#c49a2a; --bg:#f4f7f6; --sidebar-bg:#001811; --text:#404944;
    --border: rgba(0,0,0,0.05); --border-dark: rgba(255,255,255,0.1);
    --shadow: 0 10px 30px -10px rgba(0,0,0,0.05); --r-box: 16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;display:flex;height:100vh;overflow:hidden;}
  a{text-decoration:none;color:inherit} button{border:none;cursor:pointer;}

  /* ── SIDEBAR ── */
  .sidebar { width: 280px; background: var(--sidebar-bg); color: rgba(255,255,255,0.7); display: flex; flex-direction: column; padding: 32px 24px; border-right: 1px solid var(--border-dark); flex-shrink:0;}
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; padding-left: 12px; text-decoration: none;}
  .brand-logo { width: 40px; height: 40px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .brand-logo img { width: 100%; height: 100%; object-fit: contain; filter: grayscale(1); }
  .brand-text { font-size: 20px; font-weight: 800; color: white; letter-spacing: 1px; }

  .menu-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 16px; padding-left: 12px; color: rgba(255,255,255,0.4); }
  .menu-group { margin-bottom: 32px; display: flex; flex-direction: column; gap: 8px; }
  .menu-item { padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; transition: all .2s; }
  .menu-item svg { width: 18px; height: 18px; opacity: 0.7; }
  .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.06); color: white; }
  .menu-item.active svg { opacity: 1; color: var(--gold); }

  /* ── MAIN ── */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
  .topbar { height: 80px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 10; flex-shrink:0;}
  .tb-title { font-size: 20px; font-weight: 800; color: var(--green-950); display: flex; align-items: center; gap: 12px; }
  .back-link { color: #a1a1aa; transition: color .2s; } .back-link:hover { color: var(--green-950); }

  .workspace { padding: 40px; max-width: 900px; width: 100%; margin: 0 auto; }
  
  .form-panel { background: white; border: 1px solid var(--border); border-radius: var(--r-box); padding: 40px; box-shadow: var(--shadow); margin-bottom: 40px; }
  .panel-section-title { font-size: 16px; font-weight: 800; color: var(--green-700); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 24px; margin-top: 32px; display:flex; align-items:center; gap:8px;}
  .panel-section-title:first-child { margin-top: 0; }
  .panel-section-title svg { width: 18px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .form-group.full { grid-column: 1 / -1; }
  
  label { font-size: 13px; font-weight: 700; color: var(--green-950); }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; background: #fdfdfd; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
    padding: 14px 16px; font-family: inherit; font-size: 15px; color: var(--green-950);
    outline: none; transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green-700); }
  
  .file-drop {
    border: 2px dashed rgba(0,0,0,0.1); border-radius: 12px; padding: 40px; text-align: center;
    background: #fafafa; cursor: pointer; transition: all .2s; position: relative;
  }
  .file-drop:hover { border-color: var(--green-700); background: #f0f7f5; }
  .file-drop svg { color: var(--green-700); margin-bottom: 12px; }
  .file-drop p { font-size: 14px; font-weight: 600; color: var(--text); }
  .file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; margin-top: 12px; display: none; }
  
  .actions-row { display: flex; justify-content: flex-end; gap: 16px; margin-top: 40px; }
  .btn { font-size: 14px; font-weight: 700; padding: 14px 28px; border-radius: 8px; transition: all .2s; display:inline-flex; align-items:center; gap:8px; }
  .btn-outline { background: transparent; border: 1px solid rgba(0,0,0,0.1); color: var(--text); }
  .btn-outline:hover { background: #f4f4f5; }
  .btn-primary { background: var(--green-700); color: white; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0,107,95,0.4); }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="index.html" class="brand">
      <div class="brand-logo"><img src="../logo.png" alt="BIONEP"></div>
      <div class="brand-text">BIONEP<span>.</span></div>
    </a>
    <div class="menu-lbl">Principal</div>
    <div class="menu-group">
      <a href="index.html" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Visão Geral</a>
      <a href="form-blog.html" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Artigos do Blog</a>
      <a href="#" class="menu-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg> Meus Cursos</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <h2 class="tb-title">
        <a href="list-cursos.html" class="back-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
        Lançar Novo Curso
      </h2>
    </header>

    <div class="workspace">
      <div class="form-panel">
        
        <h3 class="panel-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Informações do Curso</h3>

        <div class="form-group full">
          <label>Título do Curso</label>
          <input type="text" id="titulo" placeholder="Ex: Harmonização Orofacial" oninput="autoSlug(this.value)" />
        </div>

        <div class="form-group full">
          <label>URL do Curso <span style="font-weight:500;color:#a1a1aa;">(gerada automaticamente — editável)</span></label>
          <div style="display:flex;align-items:center;gap:0;border:1px solid rgba(0,0,0,0.1);border-radius:10px;overflow:hidden;background:#fdfdfd;">
            <span style="padding:14px 16px;background:#f0f4f3;font-size:13px;font-weight:600;color:#888;white-space:nowrap;border-right:1px solid rgba(0,0,0,0.08);">/cursos/</span>
            <input type="text" id="slug" placeholder="harmonizacao-orofacial"
                   style="border:none;border-radius:0;flex:1;margin:0;" />
          </div>
          <span style="font-size:12px;color:#a1a1aa;margin-top:4px;">Apenas letras minúsculas, números e hífens. Ex: <code>harmonizacao-orofacial</code></span>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Categoria</label>
            <select id="categoria">
              <option>ESPECIALIZAÇÃO</option>
              <option>CURSO LIVRE</option>
              <option>IMERSÃO</option>
              <option>APERFEIÇOAMENTO</option>
              <option>CURSO AVANÇADO</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end;padding-bottom:8px;">
            <label>Inscrições Abertas?</label>
            <label style="display:flex;align-items:center;gap:8px;font-weight:500;margin-top:12px;">
              <input type="checkbox" id="inscricoes_abertas" checked style="width:18px;height:18px;accent-color:var(--green-700);" />
              Sim, inscrições abertas
            </label>
          </div>
        </div>

        <!-- Imagem do card (listagem) -->
        <div class="form-group full">
          <label>Imagem do Card <span style="font-weight:500;color:#a1a1aa;">(usada nos cards de listagem — quadrada ou 3:4)</span></label>
          <div class="file-drop" id="file-drop-zone">
            <input type="file" id="capa" accept="image/*" onchange="previewImagem(this)" />
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p id="file-drop-label">Arraste uma imagem ou clique para selecionar</p>
          </div>
          <img id="img-preview" class="img-preview" alt="Preview do card" />
        </div>

        <!-- Banner interno da página do curso -->
        <div class="form-group full">
          <label>Banner Interno da Página do Curso <span style="font-weight:500;color:#a1a1aa;">(hero da página — recomendado 1920×700px, paisagem)</span></label>
          <div class="file-drop" id="file-drop-zone-banner">
            <input type="file" id="capa_banner" accept="image/*" onchange="previewBanner(this)" />
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p id="file-drop-label-banner">Arraste o banner ou clique para selecionar</p>
          </div>
          <img id="banner-preview" class="img-preview" alt="Preview do banner" style="aspect-ratio:16/5;object-fit:cover;" />
        </div>

        <h3 class="panel-section-title" style="margin-top:32px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Detalhes do Curso</h3>

        <div class="form-grid">
          <div class="form-group">
            <label>Professor / Coordenador</label>
            <input type="text" id="professor" placeholder="Ex: Prof. Dra. Karen Dalla Costa" />
          </div>
          <div class="form-group">
            <label>Carga Horária</label>
            <input type="text" id="carga_horaria" placeholder="Ex: 128h" />
          </div>
          <div class="form-group">
            <label>Data de Início</label>
            <input type="text" id="data_inicio" placeholder="Ex: 21 e 22 de Maio" />
          </div>
          <div class="form-group">
            <label>Módulos</label>
            <input type="text" id="modulos" placeholder="Ex: 5 módulos" />
          </div>
        </div>

        <div class="form-group full">
          <label>Descrição do Curso</label>
          <textarea id="descricao" rows="5" placeholder="Descreva o curso, objetivos, público alvo..."></textarea>
        </div>

        <div class="actions-row">
          <button id="btn-salvar" class="btn btn-primary" onclick="salvarCurso()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Lançar Curso
          </button>
        </div>

      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
checkAuth();

// ── Modo edição: detecta ?id= na URL ──────────────────────
const params = new URLSearchParams(window.location.search);
const editId = params.get("id");

if (editId) {
  document.querySelector(".tb-title").innerHTML = `
    <a href="list-cursos.html" class="back-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
    Editar Curso`;
  document.getElementById("btn-salvar").innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
    Salvar Alterações`;
  carregarCurso(editId);
}

async function carregarCurso(id) {
  const { data, error } = await supabaseClient.from("cursos").select("*").eq("id", id).single();
  if (error || !data) { alert("Curso não encontrado."); return; }
  document.getElementById("titulo").value               = data.titulo        || "";
  document.getElementById("slug").value                 = data.slug          || "";
  document.getElementById("categoria").value            = data.categoria     || "ESPECIALIZAÇÃO";
  document.getElementById("descricao").value            = data.descricao     || "";
  document.getElementById("professor").value            = data.professor     || "";
  document.getElementById("carga_horaria").value        = data.carga_horaria || "";
  document.getElementById("data_inicio").value          = data.data_inicio   || "";
  document.getElementById("modulos").value              = data.modulos       || "";
  document.getElementById("inscricoes_abertas").checked = !!data.inscricoes_abertas;
  if (data.imagem_url) {
    const preview = document.getElementById("img-preview");
    preview.src = data.imagem_url;
    preview.style.display = "block";
    document.getElementById("file-drop-label").textContent = "Clique para trocar a imagem";
  }
  if (data.imagem_banner_url) {
    const bannerPreview = document.getElementById("banner-preview");
    bannerPreview.src = data.imagem_banner_url;
    bannerPreview.style.display = "block";
    document.getElementById("file-drop-label-banner").textContent = "Clique para trocar o banner";
  }
}

// ── Slug auto-generation ───────────────────────────────────
function generateSlug(str) {
  return str
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')  // remove accents
    .replace(/[^a-z0-9\s-]/g, '')     // remove non-alphanumeric
    .trim()
    .replace(/[\s]+/g, '-')           // spaces → hyphens
    .replace(/-+/g, '-')              // collapse multiple hyphens
    .replace(/^-+|-+$/g, '');         // trim leading/trailing hyphens
}

// only auto-fill if slug hasn't been manually edited
let slugUserEdited = false;
document.getElementById('slug').addEventListener('input', () => { slugUserEdited = true; });
document.getElementById('titulo').addEventListener('blur',  () => { slugUserEdited = false; });

function autoSlug(val) {
  if (slugUserEdited) return;
  document.getElementById('slug').value = generateSlug(val);
}

// ── Preview local ao escolher arquivo ─────────────────────
function previewImagem(input) {
  const file = input.files[0];
  if (!file) return;
  const preview = document.getElementById("img-preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  document.getElementById("file-drop-label").textContent = file.name;
}

function previewBanner(input) {
  const file = input.files[0];
  if (!file) return;
  const preview = document.getElementById("banner-preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  document.getElementById("file-drop-label-banner").textContent = file.name;
}

// ── Upload de imagem para Supabase Storage ─────────────────
async function uploadImagem(file) {
  const ext  = file.name.split(".").pop();
  const path = `cursos/${Date.now()}.${ext}`;
  const { error } = await supabaseClient.storage.from("post-images").upload(path, file, { upsert: true });
  if (error) { console.warn("Upload falhou:", error.message); return null; }
  const { data } = supabaseClient.storage.from("post-images").getPublicUrl(path);
  return data.publicUrl;
}

async function salvarCurso() {
  const titulo             = document.getElementById("titulo").value.trim();
  const categoria          = document.getElementById("categoria").value;
  const descricao          = document.getElementById("descricao").value.trim();
  const professor          = document.getElementById("professor").value.trim();
  const carga_horaria      = document.getElementById("carga_horaria").value.trim();
  const data_inicio        = document.getElementById("data_inicio").value.trim();
  const modulos            = document.getElementById("modulos").value.trim();
  const inscricoes_abertas = document.getElementById("inscricoes_abertas").checked;
  const fileInput          = document.getElementById("capa");

  if (!titulo) { alert("Informe o título do curso."); return; }

  const btn = document.getElementById("btn-salvar");
  btn.disabled = true;

  const bannerInput = document.getElementById("capa_banner");

  // Upload do card (opcional)
  let imagem_url = null;
  if (editId) {
    const preview = document.getElementById("img-preview");
    if (preview.style.display !== "none" && !fileInput.files[0]) imagem_url = preview.src;
  }
  if (fileInput.files[0]) {
    imagem_url = await uploadImagem(fileInput.files[0]);
  }

  // Upload do banner interno (opcional)
  let imagem_banner_url = null;
  if (editId) {
    const bannerPreview = document.getElementById("banner-preview");
    if (bannerPreview.style.display !== "none" && !bannerInput.files[0]) imagem_banner_url = bannerPreview.src;
  }
  if (bannerInput.files[0]) {
    imagem_banner_url = await uploadImagem(bannerInput.files[0]);
  }

  const slugRaw = document.getElementById("slug").value.trim();
  const slug = slugRaw ? generateSlug(slugRaw) : generateSlug(titulo);

  const payload = { titulo, categoria, descricao, professor, carga_horaria, data_inicio, modulos, inscricoes_abertas, slug };
  if (imagem_url) payload.imagem_url = imagem_url;
  if (imagem_banner_url) payload.imagem_banner_url = imagem_banner_url;

  let error;
  if (editId) {
    ({ error } = await supabaseClient.from("cursos").update(payload).eq("id", editId));
  } else {
    ({ error } = await supabaseClient.from("cursos").insert([payload]));
  }

  if (error) {
    alert("Erro ao salvar: " + error.message);
    console.error(error);
    btn.disabled = false;
  } else {
    alert(editId ? "Curso atualizado com sucesso! ✅" : "Curso lançado com sucesso 🚀");
    window.location.href = "list-cursos.html";
  }
}
</script>
</body>
</html>
