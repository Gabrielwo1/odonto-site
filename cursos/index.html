<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curso — BIONEP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../global.css"/>

  <style>
  :root{
    --green-950:#003527;--green-900:#001c11;--green-700:#006b5f;
    --green-600:#0b513d;--green-mint:rgba(176,240,214,.3);--cyan:#71f8e4;
    --gold:#c49a2a;--gold-soft:rgba(196,154,42,.15);--bg:#f8f9fa;
    --bg-dark:#1b1913;--bg-footer:#061710;--text:#404944;--text2:#414944;
    --border-green:rgba(6,78,59,.3);--footer-text:rgba(167,243,208,.6);
    --white:#fff;--shadow-heavy:0 25px 50px -12px rgba(0,0,0,.25);
    --shadow-light:0 8px 24px 0 rgba(25,28,30,.06);
    --r-card:12px;--r-pill:9999px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  button{border:none;cursor:pointer;font-family:inherit}
  img{display:block;max-width:100%;object-fit:cover}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--green-700);border-radius:99px}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}
  .r{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1)}
  .r.on{opacity:1;transform:none}
  .d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}

  /* NAV */
  #nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(248,249,250,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;height:93px;display:flex;align-items:center;transition:border-color .3s,box-shadow .3s;}
  #nav.scrolled{border-color:rgba(0,53,39,.12);box-shadow:0 1px 12px rgba(0,0,0,.06)}
  .nav-w{max-width:1280px;margin:0 auto;padding:0 32px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .nav-logo{display:flex;align-items:flex-start;flex-direction:column}
  .nav-logo-row{display:flex;align-items:center;gap:8px}
  .nav-links{display:flex;align-items:center;gap:0;list-style:none}
  .nav-links a{font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--green-950);padding:6px 18px;position:relative;transition:color .2s;}
  .nav-links a::after{content:'';position:absolute;bottom:-2px;left:18px;right:18px;height:2px;background:var(--green-950);border-radius:1px;transform:scaleX(0);transition:transform .25s ease;transform-origin:left;}
  .nav-links a:hover::after{transform:scaleX(1)}

  /* HERO BANNER */
  #hero-banner{margin-top:93px;position:relative;width:100%;min-height:55vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg-dark);}
  #hero-banner .bg-image{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.8;}
  #hero-banner .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,28,17,.8) 0%,rgba(0,28,17,.2) 60%,transparent 100%);}
  .hero-banner-content{position:relative;z-index:10;text-align:left;width:100%;}
  .hero-breadcrumb{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:20px;display:flex;align-items:center;gap:8px;}
  .hero-breadcrumb a{color:rgba(255,255,255,.5);transition:color .2s;}
  .hero-breadcrumb a:hover{color:var(--cyan);}
  .hero-breadcrumb span{color:rgba(255,255,255,.3);}
  .hero-banner-title{font-weight:800;font-size:clamp(36px,5.5vw,68px);line-height:1.1;letter-spacing:-1.5px;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.4);margin-bottom:12px;}
  .hero-category{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:28px;}
  .inscricoes-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(113,248,228,.12);border:1px solid rgba(113,248,228,.2);border-radius:var(--r-pill);padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);margin-bottom:24px;}
  .inscricoes-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hero-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(145deg,#004d39 0%,#003527 100%);color:white;padding:16px 36px;border-radius:var(--r-pill);font-weight:700;font-size:15px;box-shadow:0 10px 20px -5px rgba(0,53,39,.3);transition:transform .25s,box-shadow .25s;cursor:pointer;}
  .hero-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px -5px rgba(0,53,39,.45);}

  /* ── INFO BAR (cards horizontais alinhados à esquerda) ── */
  #info-bar{
    background:var(--white);
    border-bottom:1px solid rgba(0,0,0,.06);
    padding:0;
  }
  .info-bar-inner{
    max-width:1280px;
    margin:0 auto;
    padding:0 32px;
    display:flex;
    align-items:stretch;
    justify-content:flex-start;
    gap:0;
  }
  .info-card{
    display:flex;flex-direction:column;align-items:flex-start;
    padding:40px 48px 40px 0;
    border-right:1px solid rgba(0,0,0,.06);
    margin-right:48px;
    flex:0 0 auto;
    min-width:180px;
    transition:background .25s;
    gap:0;
  }
  .info-card:last-child{border-right:none;margin-right:0;}
  .info-card:hover{background:rgba(0,53,39,.03);}
  .info-icon{
    width:44px;height:44px;border-radius:14px;
    background:var(--green-mint);color:var(--green-700);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
    flex-shrink:0;
  }
  .info-title{
    font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:2px;color:var(--green-700);margin-bottom:10px;
  }
  .info-value-text{
    font-size:26px;font-weight:800;color:var(--green-950);
    line-height:1.15;letter-spacing:-.5px;
  }
  .info-value-sub{
    font-size:12px;font-weight:500;color:var(--text);
    margin-top:5px;opacity:.6;letter-spacing:.2px;
  }
  .prof-name{
    font-size:20px;font-weight:800;color:var(--green-950);
    line-height:1.25;letter-spacing:-.3px;
  }

  /* ── CONTENT ── */
  #course-content{padding:80px 0 96px;background:var(--bg);}
  .content-center{max-width:780px;margin:0;}
  .section-h2{font-size:36px;font-weight:800;color:var(--green-950);margin-bottom:28px;letter-spacing:-1px;}
  .course-desc{font-size:17px;line-height:1.85;color:var(--text);margin-bottom:20px;}
  .course-desc strong{color:var(--green-950);font-weight:700;}
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(145deg,#004d39 0%,#003527 100%);
    color:white;padding:18px 48px;border-radius:var(--r-pill);
    font-weight:700;font-size:16px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 10px 20px -5px rgba(0,53,39,.3);
    cursor:pointer;transition:transform .25s,box-shadow .25s;
    margin-top:40px;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 32px -5px rgba(0,53,39,.45);}

  /* Skeleton */
  .skeleton{background:linear-gradient(90deg,#e0e0e0 25%,#f0f0f0 50%,#e0e0e0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* FOOTER */
  #footer{background:var(--bg-footer);padding:80px 0 0;margin-top:64px;}
  .footer-top{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;border-bottom:1px solid var(--border-green);padding-bottom:56px;}
  .footer-logo{margin-bottom:20px;display:flex;align-items:center;gap:8px}
  .footer-desc{font-size:14px;line-height:22px;color:var(--footer-text);max-width:268px;}
  .footer-col-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(167,243,208,.5);margin-bottom:24px;}
  .footer-links{list-style:none;display:flex;flex-direction:column;gap:14px}
  .footer-links a{font-size:15px;color:var(--footer-text);transition:color .2s;}
  .footer-links a:hover{color:white}
  .footer-bottom{display:flex;align-items:center;justify-content:space-between;padding:20px 0;flex-wrap:wrap;gap:12px;}
  .footer-copy{font-size:13px;color:rgba(167,243,208,.3);}
  .footer-right{font-size:13px;color:rgba(167,243,208,.3);display:flex;align-items:center;gap:24px;}
  .footer-right span::before{content:'•';margin-right:24px;color:rgba(167,243,208,.2)}

  @media(max-width:900px){
    .nav-links,.nav-btn{display:none;}
    .info-bar-inner{flex-wrap:wrap;}
    .info-card{max-width:50%;min-width:50%;border-bottom:1px solid rgba(0,0,0,.06);}
    .info-card:nth-child(even){border-right:none;}
    .footer-top{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:540px){
    .info-card{max-width:100%;min-width:100%;border-right:none;}
    .hero-banner-title{font-size:36px;letter-spacing:-1px;}
    .footer-top{grid-template-columns:1fr;}
    .content-center{padding:0 4px;}
  }
  </style>
</head>
<body>

<!-- NAV -->
<div id="bionep-nav-placeholder"></div>

<!-- HERO BANNER -->
<section id="hero-banner">
  <img id="hero-img" src="../campus.png" alt="Banner do Curso" class="bg-image"/>
  <div class="overlay"></div>
  <div class="wrap" style="position:relative;z-index:10;width:100%;">
    <div class="hero-banner-content r d1">
      <nav class="hero-breadcrumb">
        <a href="../cursos.html">Cursos</a>
        <span>/</span>
        <span id="breadcrumb-titulo">Carregando...</span>
      </nav>
      <div id="inscricoes-badge" style="display:none;" class="inscricoes-badge">
        <span class="inscricoes-dot"></span>Inscrições Abertas
      </div>
      <p id="hero-category" class="hero-category"></p>
      <h1 id="hero-title" class="hero-banner-title">Carregando...</h1>
      <a href="#course-content" class="hero-btn">
        Ver detalhes do curso
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </a>
    </div>
  </div>
</section>

<!-- INFO BAR — cards horizontais centralizados -->
<div id="info-bar" class="r d2">
  <div class="info-bar-inner">

    <div class="info-card" id="card-carga" style="display:none;">
      <div class="info-icon" style="background:rgba(196,154,42,.12);color:var(--gold);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="info-title">Carga Horária</div>
      <div class="info-value-text" id="carga-val">—</div>
    </div>

    <div class="info-card" id="card-modulos" style="display:none;">
      <div class="info-icon">
        <!-- ícone de lista com checkmark — representa módulos -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>
      </div>
      <div class="info-title">Módulos</div>
      <div class="info-value-text" id="modulos-val">—</div>
      <div class="info-value-sub" id="modulos-sub" style="display:none;">Módulos Presenciais</div>
    </div>

    <div class="info-card" id="card-data" style="display:none;">
      <div class="info-icon" style="background:rgba(113,248,228,.1);color:var(--green-700);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="info-title">Próxima Turma</div>
      <div class="info-value-text" id="data-val">—</div>
    </div>

    <div class="info-card" id="card-prof" style="display:none;">
      <div class="info-icon" style="background:var(--gold-soft);color:var(--gold);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="info-title">Coordenador</div>
      <div class="prof-name" id="prof-val">—</div>
    </div>

  </div>
</div>

<!-- MAIN CONTENT -->
<section id="course-content">
  <div class="wrap">
    <div class="content-center r d3">
      <h2 class="section-h2">Sobre o curso</h2>
      <div id="course-desc-container">
        <div class="skeleton" style="height:20px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:20px;width:80%;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:20px;width:60%;"></div>
      </div>
      <p style="color:var(--green-700);font-weight:600;margin-top:32px;font-size:15px;">
        * Consulte-nos para valores especiais e bolsas parciais limitadas.
      </p>
      <a href="#" id="whatsapp-link" class="btn-primary" target="_blank" rel="noopener" style="width:auto;align-self:flex-start;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        Falar com Consultor
      </a>
    </div>
  </div>
</section>

<!-- FOOTER -->
<div id="bionep-footer-placeholder"></div>

<script>
const rEls = document.querySelectorAll('.r');
const rObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('on') });
}, { threshold:.1, rootMargin:'0px 0px -40px 0px' });
rEls.forEach(el => rObs.observe(el));

const nav_el = document.getElementById('nav');
if(nav_el){ addEventListener('scroll', () => nav_el.classList.toggle('scrolled', scrollY > 20)); }
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
  const SUPA_URL = "https://thcjrzluhsbgtbirdoxl.supabase.co";
  const SUPA_KEY = "sb_publishable_r-rBdCg4Zf5YXpP3lkJB9A_JXEN2GDB";

  /* ── Extrai o slug do pathname ─────────────────────────
     Ex: /cursos/harmonizacao-orofacial → slug = "harmonizacao-orofacial"
  ─────────────────────────────────────────────────────── */
  const parts = window.location.pathname.replace(/\/$/, '').split('/').filter(Boolean);
  const slug  = parts[parts.length - 1]; // último segmento

  /* Se não há slug (acessou /cursos/ diretamente), redireciona para listagem */
  if (!slug || slug === 'cursos') {
    window.location.href = '../cursos.html';
    return;
  }

  function esc(s){
    return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
  }

  try {
    const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

    const { data: curso, error } = await db
      .from('cursos')
      .select('*')
      .eq('slug', slug)
      .single();

    if (error || !curso) {
      window.location.href = '../cursos.html';
      return;
    }

    /* ── <title> e SEO ── */
    document.title = `${curso.titulo} — BIONEP`;

    /* ── Breadcrumb ── */
    document.getElementById('breadcrumb-titulo').textContent = curso.titulo;

    /* ── Hero ── */
    document.getElementById('hero-title').textContent  = curso.titulo;
    if (curso.categoria) document.getElementById('hero-category').textContent = curso.categoria;
    if (curso.inscricoes_abertas) document.getElementById('inscricoes-badge').style.display = 'inline-flex';

    /* Banner interno tem prioridade; fallback para imagem do card */
    const heroBg = curso.imagem_banner_url || curso.imagem_url;
    if (heroBg) document.getElementById('hero-img').src = heroBg;

    /* ── WhatsApp link ── */
    const msg = encodeURIComponent(`Olá! Tenho interesse no curso de ${curso.titulo}. Pode me passar mais informações?`);
    document.getElementById('whatsapp-link').href = `https://wa.me/5541999999999?text=${msg}`;

    /* ── Descrição ── */
    const descContainer = document.getElementById('course-desc-container');
    if (curso.descricao) {
      descContainer.innerHTML = curso.descricao
        .split('\n\n').filter(p => p.trim())
        .map(p => `<p class="course-desc">${esc(p).replace(/\n/g,'<br>')}</p>`)
        .join('');
    } else {
      descContainer.innerHTML = `<p class="course-desc">Informações sobre este curso em breve.</p>`;
    }

    /* ── Info cards ── */

    // Módulos: pode vir como JSON array ["mod1","mod2",...] ou string simples
    if (curso.modulos) {
      let modulosLabel = curso.modulos;
      try {
        const arr = typeof curso.modulos === 'string' ? JSON.parse(curso.modulos) : curso.modulos;
        if (Array.isArray(arr) && arr.length) {
          modulosLabel = arr.length;
          document.getElementById('modulos-sub').style.display = 'block';
        }
      } catch(e) { /* string simples, usa como está */ }
      document.getElementById('modulos-val').textContent = modulosLabel;
      document.getElementById('card-modulos').style.display = 'flex';
    }

    // Carga horária
    if (curso.carga_horaria) {
      document.getElementById('carga-val').textContent = curso.carga_horaria;
      document.getElementById('card-carga').style.display = 'flex';
    }

    // Data: formata YYYY-MM-DD → DD/MM/YYYY em pt-BR
    if (curso.data_inicio) {
      let dataLabel = curso.data_inicio;
      try {
        const d = new Date(curso.data_inicio + 'T12:00:00');
        dataLabel = d.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
      } catch(e) {}
      document.getElementById('data-val').textContent = dataLabel;
      document.getElementById('card-data').style.display = 'flex';
    }

    // Coordenador
    if (curso.professor) {
      document.getElementById('prof-val').textContent = curso.professor;
      document.getElementById('card-prof').style.display = 'flex';
    }

    document.querySelectorAll('.r').forEach(el => rObs.observe(el));

  } catch(err) {
    console.error('Erro ao carregar curso:', err.message);
    window.location.href = '../cursos.html';
  }
})();
</script>

<script src="../components.js"></script>
</body>
</html>
