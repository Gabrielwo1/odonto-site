<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post — BIONEP</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="global.css"/>
  <style>
  /* ─── TOKENS ─────────────────────────────────────────────── */
  :root{
    --green-950:#003527;
    --green-900:#001c11;
    --green-700:#006b5f;
    --green-600:#0b513d;
    --green-mint:rgba(176,240,214,.3);
    --cyan:#71f8e4;
    --red:#560f11;
    --gold:#c49a2a;
    --bg:#f8f9fa;
    --bg-footer:#061710;
    --text:#404944;
    --white:#fff;
    --shadow-heavy:0 25px 50px -12px rgba(0,0,0,.25);
    --shadow-light:0 12px 30px 0 rgba(0,0,0,.04);
    --r-card:20px;
    --r-pill:9999px;
  }

  /* ─── RESET ──────────────────────────────────────────────── */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  button{border:none;cursor:pointer;font-family:inherit}
  img{display:block;max-width:100%;object-fit:cover; border-radius: inherit;}
  ul{list-style:none}

  /* ─── SCROLLBAR ─────────────────────────────────────────── */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--green-700);border-radius:99px}

  /* ─── REVEAL ─────────────────────────────────────────────── */
  .r{opacity:0;transform:translateY(24px);transition:all .8s cubic-bezier(.16,1,.3,1)}
  .r.on{opacity:1;transform:none}
  .d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}.d4{transition-delay:.4s}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}

  <div id="bionep-nav-placeholder"></div>

  /* ══════════════════════════════════════════════════════════
     BLOG LAYOUT
  ══════════════════════════════════════════════════════════ */
  .blog-wrap {
    max-width: 1280px; margin: 157px auto 120px; /* offset nav */
    padding: 0 32px;
    display: grid; grid-template-columns: 2.5fr 1fr;
    gap: 64px;
    align-items: start;
  }

  /* ─── ARTICLE MAIN ─── */
  .article-main {
    background: white; border-radius: var(--r-card);
    box-shadow: var(--shadow-light); border: 1px solid rgba(0,0,0,0.03);
    overflow: hidden; padding: 48px;
  }

  .breadcrumbs {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; font-weight: 600; color: #a1a1aa;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 32px;
  }
  .breadcrumbs a { transition: color .2s; }
  .breadcrumbs a:hover { color: var(--green-700); }
  .breadcrumbs .current { color: var(--green-700); }

  .post-tag {
    font-size: 11px; font-weight: 800; color: var(--gold); display: inline-block;
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px;
  }

  .article-title {
    font-size: clamp(28px, 4vw, 42px); font-weight: 800; color: var(--green-950);
    line-height: 1.2; margin-bottom: 24px; letter-spacing: -1px;
  }

  .article-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 600; color: #a1a1aa;
    text-transform: uppercase; letter-spacing: 0.8px;
    padding-bottom: 32px; margin-bottom: 32px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .article-featured-img {
    width: 100%; height: auto; max-height: 500px; border-radius: 12px;
    margin-bottom: 48px;
  }

  .article-content {
    font-size: 17px; line-height: 1.8; color: var(--text);
  }
  .article-content p { margin-bottom: 24px; }
  .article-content h2 {
    font-size: 26px; font-weight: 800; color: var(--green-950);
    margin: 48px 0 24px; letter-spacing: -0.5px;
  }
  .article-content blockquote {
    font-size: 20px; font-style: italic; color: var(--green-700);
    border-left: 4px solid var(--gold); padding: 24px 32px;
    background: var(--green-mint); border-radius: 0 16px 16px 0;
    margin: 40px 0;
  }
  .article-content ul {
    margin-bottom: 24px; padding-left: 24px; list-style-type: disc;
  }
  .article-content li { margin-bottom: 12px; padding-left: 8px; }

  /* ─── RIGHT: SIDEBAR (Exact same as blog) ─── */
  .blog-sidebar {
    display: flex; flex-direction: column; gap: 40px;
    top: 120px; position: sticky; 
  }
  .widget {
    background: white; border-radius: 20px;
    box-shadow: var(--shadow-light); padding: 32px;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .widget-title {
    font-size: 12px; font-weight: 800; color: var(--green-950);
    text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 24px; display: flex; align-items: center; gap: 12px;
  }
  .widget-title::before {
    content: ''; width: 4px; height: 16px; background: var(--gold); border-radius: 4px;
  }
  .search-box {
    position: relative; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
    overflow: hidden; transition: border-color .3s;
  }
  .search-box:focus-within { border-color: var(--green-700); }
  .search-input {
    width: 100%; border: none; padding: 16px 48px 16px 20px;
    font-family: inherit; font-size: 15px; background: #fdfdfd; outline: none;
  }
  .search-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: #a1a1aa; padding: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .recent-posts { display: flex; flex-direction: column; gap: 16px; }
  .recent-post-link {
    display: block; font-size: 14px; font-weight: 700; color: var(--text);
    line-height: 1.5; text-decoration: none; padding-bottom: 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06); transition: color .2s;
  }
  .recent-post-link:last-child { border-bottom: none; padding-bottom: 0; }
  .recent-post-link:hover { color: var(--green-700); }
  .cat-link {
    display: block; font-size: 15px; font-weight: 500; color: var(--text);
    padding: 12px 16px; border-radius: 10px; text-decoration: none;
    transition: all .2s; background: rgba(0,0,0,0.02);
  }
  .cat-link:hover { background: var(--green-mint); color: var(--green-700); font-weight: 700; }
  .social-icons { display: flex; align-items: center; gap: 12px; }
  .btn-social {
    width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
    color: var(--text); background: white; transition: all .2s;
  }
  .btn-social:hover {
    background: var(--green-700); color: white; border-color: transparent; transform: translateY(-2px);
  }

  /* ══════════════════════════════════════════════════════════
     RESPONSIVE
  ══════════════════════════════════════════════════════════ */
  @media(max-width:1100px){
    .blog-wrap { grid-template-columns: 1fr; gap: 48px; }
    .blog-sidebar { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .col-span { grid-column: 1 / -1; }
  }
  @media(max-width:768px){
    .article-main { padding: 32px 24px; }
    .blog-sidebar { grid-template-columns: 1fr; }
    .article-meta { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
    .btn-primary,.nav-btn{will-change:transform}
  .nav-btn{
    background:linear-gradient(145deg,#004d39 0%,#003527 100%);
    color:white;padding:12px 28px;border-radius:var(--r-pill);
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    box-shadow:0 10px 20px -5px rgba(0,53,39,.3);
    border:none;display:inline-flex;position:relative;overflow:hidden;
    transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s;
    text-decoration:none;
  }
  .nav-btn::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
    transition:left .5s ease;
  }
  .nav-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -5px rgba(0,53,39,.5)}
  .nav-btn:hover::before{left:100%}
</style>
</head>
<body>

<div id="bionep-nav-placeholder"></div>

<!-- LAYOUT -->
<div class="blog-wrap">
  
  <!-- LEFT ARTICLE CORE -->
  <main class="article-main r d1" id="article-main">

    <div class="breadcrumbs">
       <a href="index.html">Home</a>
       <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
       <a href="blog.html">Notícias</a>
       <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
       <span class="current" id="breadcrumb-titulo">Artigo</span>
    </div>

    <span class="post-tag" id="post-tag">NOTÍCIAS</span>
    <h1 class="article-title" id="article-title">Carregando...</h1>

    <div class="article-meta">
      <span id="article-date"><svg style="margin-right:6px;width:14px;margin-bottom:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
      <span style="color:var(--green-950);">POR <strong>INSTITUTO BIONEP</strong></span>
    </div>

    <img id="article-featured-img" class="article-featured-img r d2" alt="Imagem do artigo" style="display:none;" />

    <div class="article-content r d3" id="article-content">
      <p style="color:#a1a1aa;">Carregando conteúdo...</p>
    </div>

  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="blog-sidebar r d2">

    <!-- Search widget -->
    <div class="widget col-span">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Pesquisar artigos..." onkeyup="if(event.key==='Enter') window.location.href='blog.html'">
        <button class="search-btn" onclick="window.location.href='blog.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
    </div>

    <!-- Recent Posts -->
    <div class="widget">
      <h3 class="widget-title">Posts Recentes</h3>
      <div class="recent-posts" id="recent-posts-sidebar">
        <span style="color:#a1a1aa;font-size:13px;">Carregando...</span>
      </div>
    </div>

    <!-- Category -->
    <div class="widget">
      <h3 class="widget-title">Categorias</h3>
      <div id="categorias-sidebar">
        <a href="blog.html" class="cat-link">Notícias</a>
      </div>
    </div>

    <!-- Social -->
    <div class="widget">
      <h3 class="widget-title">Siga-nos</h3>
      <div class="social-icons">
        <a href="#" class="btn-social">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
        </a>
        <a href="#" class="btn-social">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
      </div>
    </div>

  </aside>

</div>

<div id="bionep-footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ── Reveal ──────────────────────────────────────────── */
const rEls = document.querySelectorAll('.r');
const rObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('on') });
}, { threshold:.1, rootMargin:'0px 0px -40px 0px' });
rEls.forEach(el => rObs.observe(el));

/* ── Supabase ─────────────────────────────────────────── */
const SUPA_URL = "https://jyrcknvxnkobngpzrqok.supabase.co";
const SUPA_KEY = "sb_publishable_6zohSf7oHukZKO9h0CY-6g_yVP97NTK";
const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const params  = new URLSearchParams(window.location.search);
const postId  = params.get("id");

if (!postId) { window.location.href = "blog.html"; }

async function carregarPost() {
  const { data: post, error } = await db.from("posts").select("*").eq("id", postId).single();

  if (error || !post) {
    document.getElementById("article-title").textContent = "Artigo não encontrado.";
    document.getElementById("article-content").innerHTML = `<p>Este artigo não existe ou foi removido. <a href="blog.html" style="color:var(--green-700);">Voltar para Notícias</a></p>`;
    return;
  }

  // Meta tag & título
  document.title = `${post.titulo} — BIONEP`;

  // Breadcrumb
  const tituloShort = post.titulo.length > 45 ? post.titulo.substring(0, 45) + "…" : post.titulo;
  document.getElementById("breadcrumb-titulo").textContent = tituloShort;

  // Campos
  document.getElementById("post-tag").textContent    = post.categoria || "NOTÍCIAS";
  document.getElementById("article-title").textContent = post.titulo;

  // Data
  const dataStr = post.criado_em
    ? new Date(post.criado_em).toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" }).toUpperCase()
    : "";
  document.getElementById("article-date").innerHTML = `<svg style="margin-right:6px;width:14px;margin-bottom:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${dataStr}`;

  // Imagem de capa
  if (post.imagem_url) {
    const img = document.getElementById("article-featured-img");
    img.src   = post.imagem_url;
    img.alt   = post.titulo;
    img.style.display = "block";
  }

  // Conteúdo: divide por linha dupla → parágrafos
  const paragrafos = (post.conteudo || post.descricao || "").split(/\n{2,}/).filter(t => t.trim());
  document.getElementById("article-content").innerHTML = paragrafos.length
    ? paragrafos.map(p => `<p>${p.trim().replace(/\n/g, "<br>")}</p>`).join("")
    : `<p>${post.descricao || ""}</p>`;
}

async function carregarSidebar() {
  const { data: posts } = await db
    .from("posts")
    .select("id, titulo, categoria")
    .eq("status", "publicado")
    .order("criado_em", { ascending: false })
    .limit(5);

  const recentes = posts || [];
  document.getElementById("recent-posts-sidebar").innerHTML = recentes.length
    ? recentes.map(p => `<a href="post.html?id=${p.id}" class="recent-post-link">${p.titulo}</a>`).join("")
    : `<span style="color:#a1a1aa;font-size:13px;">Nenhum post ainda.</span>`;

  const counts = {};
  recentes.forEach(p => { const c = p.categoria || "NOTÍCIAS"; counts[c] = (counts[c] || 0) + 1; });
  document.getElementById("categorias-sidebar").innerHTML = Object.entries(counts).length
    ? Object.entries(counts).map(([cat, n]) => `<a href="blog.html" class="cat-link">${cat} (${n})</a>`).join("")
    : `<a href="blog.html" class="cat-link">Notícias</a>`;
}

carregarPost();
carregarSidebar();
</script>
<script src="components.js"></script>
</body>
</html>
